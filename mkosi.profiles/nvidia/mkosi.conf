# NOT ported from tuna-os/tunaOS -- tunaOS has no working Ubuntu+nvidia path
# to port. Its nvidia overlay (Containerfile.overlay ->
# build_scripts/overlay/nvidia.sh) pulls prebuilt kernel module RPMs from
# ghcr.io/ublue-os/akmods-nvidia-open, which is dnf/RPM-only and has no apt
# equivalent; Containerfile.ubuntu declares an ENABLE_NVIDIA build arg that
# is never actually consumed anywhere in that file. So this profile uses
# Ubuntu's own standard packaging instead.
#
# VERIFIED against packages.ubuntu.com/resolute (2026-08-05 pre-merge audit):
# all five package names below exist in the real resolute archive at
# version 580.173.02-0ubuntu0.26.04.1 (nvidia-graphics-drivers-580 source).
# Newer driver branches also exist in resolute if you'd rather track those
# instead (nvidia-driver-595 confirmed present at 595.84-0ubuntu0.26.04.1;
# nvidia-driver-610-open also appears in the multiverse updates pocket) --
# 580 was kept since it's the one that was actually verified end to end
# (metapackage + all four support libraries), not because it's necessarily
# the newest. Swap the branch number here if you want a newer one, but
# re-verify the full set of *-580-suffixed names if you do, since the
# support library names carry the branch suffix too.
[Content]
Packages=
    nvidia-driver-580
    nvidia-utils-580
    libnvidia-gl-580
    libnvidia-encode-580
    libnvidia-decode-580
