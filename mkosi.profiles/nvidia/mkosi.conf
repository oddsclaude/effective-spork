# Optional NVIDIA driver stack, mirrors the ENABLE_NVIDIA=1 branch of
# build_files/desktop.sh. Enable with the `nvidia` mkosi profile (the
# Justfile does this automatically when ENABLE_NVIDIA=1 is set).
[Content]
Packages=
    nvidia-open-dkms
    nvidia-utils
    nvidia-settings
    lib32-nvidia-utils
    egl-wayland
    vulkan-icd-loader
    lib32-vulkan-icd-loader
