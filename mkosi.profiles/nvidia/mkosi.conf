# NOT ported from tuna-os/tunaOS -- tunaOS has no working Ubuntu+nvidia path
# to port. Its nvidia overlay (Containerfile.overlay ->
# build_scripts/overlay/nvidia.sh) pulls prebuilt kernel module RPMs from
# ghcr.io/ublue-os/akmods-nvidia-open, which is dnf/RPM-only and has no apt
# equivalent; Containerfile.ubuntu declares an ENABLE_NVIDIA build arg that
# is never actually consumed anywhere in that file. So this profile uses
# Ubuntu's own standard packaging instead.
#
# UNVERIFIED / please double check: Ubuntu versions its proprietary driver
# packages by branch number (nvidia-driver-<NNN>), which changes over time
# and isn't discoverable from this environment. The package names below are
# a placeholder for "whatever the current recommended branch is in the
# resolute archive" -- run `apt-cache search '^nvidia-driver-[0-9]+$'` (or
# check `ubuntu-drivers list` on real hardware) against an actual resolute
# system/mirror and correct the version number before relying on this.
[Content]
Packages=
    nvidia-driver-580
    nvidia-utils-580
    libnvidia-gl-580
    libnvidia-encode-580
    libnvidia-decode-580
