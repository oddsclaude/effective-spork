# Build-time-only dependencies needed to compile bootc from source (see
# mkosi.prepare.chroot in this directory). Modeled on bootcrew/mono's
# ubuntu/Containerfile builder stage
# (https://github.com/bootcrew/mono/blob/main/ubuntu/Containerfile):
#   apt install -y git curl make build-essential go-md2man libzstd-dev pkgconf libostree-dev ostree
# curl/libostree-dev/ostree are already in mkosi.profiles/base/mkosi.conf,
# not repeated here.
#
# All verified to exist in the real resolute archive via packages.ubuntu.com
# before adding (same audit discipline as the rest of this repo's packages).
[Content]
Packages=
    git
    make
    build-essential
    go-md2man
    libzstd-dev
    pkgconf
