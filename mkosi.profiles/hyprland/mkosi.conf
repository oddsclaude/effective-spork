# Hyprland desktop flavor. Combines build_files/desktop.sh's `hyprland`
# case with build_files/build.sh's package list.
#
# IMPORTANT, please double check this list against what you actually want:
# in the old Containerfile.arch, the RUN line that was supposed to chain
# desktop.sh and build.sh together was missing a `&&`:
#
#   /run/context/build_files/desktop.sh hyprland \
#   /run/context/build_files/build.sh
#
# ...which shell-parses as `desktop.sh hyprland /run/context/build_files/build.sh`
# -- i.e. build.sh was passed as an unused second argument to desktop.sh and
# never actually executed. build.sh also has its own bug independent of
# that (a missing trailing `\` after `lib32-vulkan-icd-loader` that breaks
# the pacman package list into an invalid second command). So in the image
# that Containerfile.arch actually produced, only desktop.sh's packages
# were ever installed -- everything from build.sh (steam, firefox, docker,
# niri, fonts, etc.) was silently never applied.
#
# Since build.sh is documented in the README as "the best place to install
# new packages" and clearly reflects intent, I've treated its list as
# wanted and included it here (deduplicated against base/desktop.sh, with
# nvidia packages left out -- see mkosi.profiles/nvidia/, since build.sh
# installed those unconditionally while desktop.sh correctly gated them
# behind ENABLE_NVIDIA, which looks like a copy/paste mistake in build.sh
# rather than intent). If you actually wanted the minimal desktop.sh-only
# image, trim this list back down.
[Content]
Packages=
    hyprland
    hypridle
    hyprlock
    hyprpaper
    xdg-desktop-portal-hyprland
    waybar
    greetd
    greetd-tuigreet
    kitty
    polkit-gnome
    qt5-wayland
    qt6-wayland
    ghostty
    rofi
    mate-polkit
    pavucontrol
    bluetui
    steam
    base-devel
    alacritty
    firefox
    docker
    docker-compose
    docker-buildx
    ollama-cuda
    niri
    ffmpegthumbs
    gst-libav
    libglvnd
    librsvg
    mpv-mpris
    playerctl
    alsa-firmware
    linux-firmware-intel
    pipewire-audio
    pipewire-ffado
    pipewire-libcamera
    pipewire-zeroconf
    sof-firmware
    firewalld
    libmtp
    nss-mdns
    samba
    smbclient
    udiskie
