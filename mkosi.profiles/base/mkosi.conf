# Core packages every build of this image needs, regardless of desktop
# flavor. Translated from tuna-os/tunaOS's build_scripts/10-base-packages.sh
# apt branch, plus the packages Containerfile.ubuntu's base-no-de stage
# always installs directly (ostree/dracut/tpm2 userspace/etc). NOT a
# find-replace of the old pacman list -- package names and the reasons for
# some of them (see comments) are apt/Ubuntu-specific.
[Content]
Packages=
    ca-certificates
    curl
    gpg
    ostree
    libostree-1-1
    dracut
    btrfs-progs
    dosfstools
    e2fsprogs
    xfsprogs
    skopeo
    jq
    systemd-boot
    systemd-boot-efi
    dmsetup
    # dracut's tpm2-tss module is part of Ubuntu's default dracut module set
    # and dracut treats a requested-but-unsatisfiable module as fatal, not
    # skippable ("Module 'tpm2-tss' cannot be installed") -- this killed
    # every tunaOS Ubuntu build until they installed the TPM2 userspace
    # instead of omitting the module (LUKS auto-unlock needs it later).
    # t64 suffixes are Ubuntu's 64-bit time_t transition; verify these
    # package names against the actual resolute archive before relying on
    # them, package name suffixes shift between Ubuntu releases.
    tpm2-tools
    libtss2-tcti-device0t64
    libtss2-tctildr0t64
    libtss2-rc0t64
    libtss2-esys-3.0.2-0t64
    buildah
    podman
    systemd-container
    util-linux
    fdisk
    flatpak
    distrobox
    fastfetch
    fwupd
    dbus-daemon
    fuse-overlayfs
    systemd-resolved
    gcc
    g++
    plymouth
    plymouth-themes
    xdg-desktop-portal
    systemd-oomd
    power-profiles-daemon
    fzf
    glow
    wl-clipboard
    gum
    wayland-utils
    grim
    x11-xserver-utils
    unzip
    powertop
    just
    ffmpeg
    gstreamer1.0-plugins-base
    gstreamer1.0-plugins-good
    gstreamer1.0-plugins-bad
    gstreamer1.0-plugins-ugly
    gstreamer1.0-libav
    libavcodec-extra
