# Core packages every build of this image needs, regardless of desktop
# flavor. Mirrors the first `pacman -S` block in the old Containerfile.arch
# `base` stage.
[Content]
Packages=
    base
    dracut
    linux
    linux-headers
    linux-firmware
    ostree
    btrfs-progs
    e2fsprogs
    xfsprogs
    dosfstools
    skopeo
    podman
    dbus
    glib2
    shadow
    systemd
    networkmanager
    pipewire
    wireplumber
    flatpak
    fwupd
    plymouth
    power-profiles-daemon
    fastfetch
    wl-clipboard
    unzip
    curl
    git
    just
    yq
    glow
    gum
    tailscale
    ffmpeg
    gst-plugins-base
    gst-plugins-good
    gst-plugins-bad
    gst-plugins-ugly
