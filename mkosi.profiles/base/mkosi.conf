# Core packages every build of this image needs, regardless of desktop
# flavor. Translated from tuna-os/tunaOS's build_scripts/10-base-packages.sh
# apt branch, plus the packages Containerfile.ubuntu's base-no-de stage
# always installs directly (ostree/dracut/tpm2 userspace/etc). NOT a
# find-replace of the old pacman list -- package names and the reasons for
# some of them (see comments) are apt/Ubuntu-specific.
#
# IMPORTANT: every package the image needs from Ubuntu's own archive belongs
# in this list, not in an `apt-get install` call inside a mkosi.prepare.chroot
# or mkosi.postinst.chroot script. mkosi installs [Content] Packages= through
# its own sandboxed apt machinery (matching Repositories= under
# [Distribution] in the top-level mkosi.conf); by the time any chroot script
# runs afterward, Ubuntu's own apt sources are NOT present in the chroot for
# manual apt-get calls to use (confirmed via a real CI failure -- see the
# commit that removed the old base/mkosi.prepare.chroot for the full
# explanation). Only genuinely third-party repos (like bootc's, see
# mkosi.profiles/bootc/) still need a script-based apt-get, and even those
# can only resolve dependencies that are already satisfied by packages
# listed here -- not by reaching Ubuntu's archive at that point.
[Content]
Packages=
    ca-certificates
    curl
    gpg
    ostree
    libostree-1-1
    # bootc's .deb (see mkosi.profiles/bootc/mkosi.prepare.chroot) depends on
    # dracut/ostree/libostree-dev; dracut and ostree are already listed here,
    # but libostree-dev wasn't until this fix. Ubuntu's own archive isn't
    # reachable from the script that installs bootc's .deb (see note above),
    # so this dependency has to already be satisfied by an installed package
    # rather than resolved from a repo at that point.
    libostree-dev
    dracut
    btrfs-progs
    dosfstools
    e2fsprogs
    xfsprogs
    skopeo
    jq
    systemd-boot
    systemd-boot-efi
    dmsetup
    # dracut's tpm2-tss module is part of Ubuntu's default dracut module set
    # and dracut treats a requested-but-unsatisfiable module as fatal, not
    # skippable ("Module 'tpm2-tss' cannot be installed") -- this killed
    # every tunaOS Ubuntu build until they installed the TPM2 userspace
    # instead of omitting the module (LUKS auto-unlock needs it later).
    # t64 suffixes are Ubuntu's 64-bit time_t transition; verified against
    # the real resolute archive (packages.ubuntu.com) at version 4.1.3-6.
    tpm2-tools
    libtss2-tcti-device0t64
    libtss2-tctildr0t64
    libtss2-rc0t64
    libtss2-esys-3.0.2-0t64
    # Kernel + firmware. Used to be apt-get installed imperatively from
    # mkosi.prepare.chroot -- moved here because that script's apt-get call
    # ran against a chroot with no apt sources configured and failed in CI
    # ("Unable to locate package linux-generic"). Ubuntu stages the actual
    # vmlinuz under /boot, not /usr/lib/modules/<kver>/ where bootc expects
    # it -- that copy now happens in mkosi.postinst.chroot instead, since it's
    # pure file manipulation with no apt/network dependency.
    linux-generic
    linux-firmware
    buildah
    podman
    systemd-container
    util-linux
    fdisk
    flatpak
    distrobox
    fastfetch
    fwupd
    dbus-daemon
    fuse-overlayfs
    systemd-resolved
    gcc
    g++
    plymouth
    plymouth-themes
    xdg-desktop-portal
    systemd-oomd
    power-profiles-daemon
    fzf
    glow
    wl-clipboard
    gum
    wayland-utils
    grim
    x11-xserver-utils
    unzip
    powertop
    just
    ffmpeg
    gstreamer1.0-plugins-base
    gstreamer1.0-plugins-good
    gstreamer1.0-plugins-bad
    gstreamer1.0-plugins-ugly
    gstreamer1.0-libav
    libavcodec-extra
