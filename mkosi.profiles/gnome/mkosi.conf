# GNOME desktop flavor, replacing the old Hyprland profile now that the base
# distro is Ubuntu. Package list translated from tuna-os/tunaOS's
# build_scripts/desktop/gnome.sh apt branch. tunaOS's Ubuntu path does not
# support Hyprland at all (only gnome/kde/niri/cosmic/xfce, and niri there
# leans on zirconium/DankMaterialShell assets this repo doesn't have), so
# rather than bolt on an unofficial Hyprland PPA with nothing to do with
# tunaOS or Ubuntu's own repos, this profile replaces hyprland outright per
# the maintainer's "swap to ubuntu with gnome" request.
[Content]
Packages=
    # Ubuntu 26.04 ships GNOME via ubuntu-desktop-minimal.
    # --no-install-recommends (mkosi's default apt install behavior) means
    # gnome-session/ubuntu-session/gnome-keyring must be listed explicitly:
    # since resolute's GNOME 50.1 update they stopped being pulled in as
    # hard deps, only recommends. tunaOS hit this as a real regression
    # (grouper gnome red 2026-07-21) -- without gnome-session/ubuntu-session,
    # /usr/share/wayland-sessions has no *gnome*.desktop and the greeter has
    # nothing to launch; without gnome-keyring, nothing can unlock secrets at
    # login.
    ubuntu-desktop-minimal
    gnome-shell-extension-manager
    gnome-session
    ubuntu-session
    gnome-keyring
    libpam-gnome-keyring
    gnome-browser-connector
    gnome-disk-utility
    gnome-system-monitor
    gnome-user-docs
    nautilus
    yelp
    plymouth-theme-spinner
    xdg-desktop-portal-gnome
    xdg-desktop-portal-gtk
    xdg-user-dirs-gtk
