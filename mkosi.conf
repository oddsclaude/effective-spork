[Config]
MinimumVersion=26~devel

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,restricted,universe,multiverse

[Content]
Hostname=spork-desktop

[Build]
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Output]
Format=oci
ImageId=spork-desktop
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%v_%a
