[Config]
MinimumVersion=25

[Distribution]
Distribution=arch

[Content]
Hostname=spork-desktop

[Build]
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Output]
ImageId=spork-desktop
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%v_%a
