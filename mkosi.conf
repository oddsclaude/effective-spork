[Config]
MinimumVersion=25

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,restricted,universe,multiverse

[Content]
Hostname=spork-desktop
# bootc (via composefs) does the bootloader/kernel staging at install/update
# time, so the image must NOT carry mkosi-generated BLS entries in /boot.
# mkosi runs install_kernel() AFTER mkosi.finalize.chroot, re-populating /boot
# and defeating the script's `rm -rf /boot` -- and those entries use
# boot-partition-relative paths ("linux /spork-desktop/<kver>/vmlinuz") that
# composefs resolves against the image root, failing bootc switch/update with
# 'Directory entry ... does not exist'. Bootable=no makes mkosi skip the
# bootloader/kernel-install phases entirely; bootc then picks up the kernel via
# /usr/lib/modules/<kver>/{vmlinuz,initramfs.img} (see
# mkosi.profiles/base/mkosi.postinst.chroot and mkosi.finalize.chroot).
Bootable=no

[Build]
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Output]
Format=oci
ImageId=spork-desktop
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%v_%a
